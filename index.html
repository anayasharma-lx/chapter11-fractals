<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fractal Builder — Ch. 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f2ec;--paper:#fff;--sand:#e8e4db;--ink:#1a1714;--rule:#ccc8be;
  --blue:#1650a8;--green:#1a6e42;--amber:#c47a0a;--red:#b83020;
  --display:'Bebas Neue',Impact,sans-serif;
  --mono:'DM Mono',monospace;--body:'DM Sans',sans-serif;
}
html{background:var(--bg)}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;padding:0}

/* MASTHEAD */
.masthead{border-bottom:3px solid var(--ink);padding:16px 24px 12px;
  display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline}
.m-tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;opacity:.4;white-space:nowrap}
.m-title{font-family:var(--display);font-size:clamp(26px,6.5vw,54px);line-height:.92;
  text-align:center;letter-spacing:.02em}
.m-right{font-family:var(--mono);font-size:10px;opacity:.4;text-align:right;white-space:nowrap}
@media(max-width:480px){.masthead{grid-template-columns:1fr}.m-tag,.m-right{display:none}}

/* FRACTAL TABS — horizontal scroll */
.fractal-bar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
  border-bottom:2px solid var(--ink);scrollbar-width:none;background:var(--paper)}
.fractal-bar::-webkit-scrollbar{display:none}
.fractal-btn{padding:12px 22px;border:none;border-bottom:3px solid transparent;
  background:transparent;font-family:var(--display);font-size:18px;letter-spacing:.04em;
  color:var(--ink);opacity:.35;cursor:pointer;white-space:nowrap;flex-shrink:0;
  margin-bottom:-2px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.fractal-btn.active{opacity:1;border-bottom-color:var(--ink)}

/* STEP CONTROLS */
.step-strip{padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step-lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);opacity:.4;flex-shrink:0}
.step-badge{font-family:var(--display);font-size:38px;letter-spacing:.02em;color:var(--ink);
  line-height:1;min-width:36px}
.s-btn{padding:8px 18px;border:1.5px solid var(--rule);background:transparent;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink);opacity:.6;cursor:pointer;transition:all .12s;
  -webkit-tap-highlight-color:transparent}
.s-btn:hover{opacity:1;border-color:var(--ink)}
.s-btn:disabled{opacity:.25;cursor:not-allowed}
.s-btn.primary{background:var(--ink);color:#f4f2ec;border-color:var(--ink);opacity:1}

/* CANVAS */
.canvas-section{background:var(--sand);border-bottom:1px solid var(--rule);
  display:flex;justify-content:center;padding:16px}
canvas#frac-cvs{display:block;border:1.5px solid var(--rule)}

/* STATS */
.stats-section{padding:16px 24px;border-bottom:1px solid var(--rule)}
.stats-head{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);opacity:.4;margin-bottom:10px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat-box{padding:12px 14px;background:var(--paper);border:1.5px solid var(--rule)}
.sb-lbl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);opacity:.4;margin-bottom:4px}
.sb-val{font-family:var(--display);font-size:clamp(20px,3.5vw,30px);letter-spacing:.02em;line-height:1}
.sb-val.blue{color:var(--blue)}
.sb-val.red{color:var(--red)}
.sb-val.green{color:var(--green)}

/* FORMULA STRIP */
.formula-strip{padding:16px 24px;background:var(--ink);border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:12px;color:#f0ece3;line-height:1.9}
.fs-hl{color:#e8a840;font-weight:600}
.fs-green{color:#6ec891}
.fs-blue{color:#6ba3d6}

/* INSIGHT */
.insight-row{padding:16px 24px;display:grid;grid-template-columns:3px 1fr;gap:14px}
.ins-bar{background:var(--amber)}
.ins-text{font-size:13.5px;line-height:1.75;color:var(--ink);opacity:.7}
.ins-text strong{opacity:1}
</style>
</head>
<body>

<div class="masthead">
  <div class="m-tag">Ch. 11 · 3D Shapes &amp; Nets</div>
  <div class="m-title">Fractal Builder</div>
  <div class="m-right">Grade 8 · Oxford / Bhanzu</div>
</div>

<div class="fractal-bar">
  <button class="fractal-btn active" data-f="0">Sierpiński Carpet</button>
  <button class="fractal-btn" data-f="1">Sierpiński Gasket</button>
  <button class="fractal-btn" data-f="2">Koch Snowflake</button>
</div>

<div class="step-strip">
  <span class="step-lbl">Step</span>
  <span class="step-badge" id="step-badge">0</span>
  <button class="s-btn" id="btn-prev" disabled>← Previous</button>
  <button class="s-btn primary" id="btn-next">Next step →</button>
  <button class="s-btn" id="btn-reset">Reset</button>
</div>

<div class="canvas-section">
  <canvas id="frac-cvs"></canvas>
</div>

<div class="stats-section">
  <div class="stats-head">Pattern statistics</div>
  <div class="stats-grid" id="stats-grid"></div>
</div>

<div class="formula-strip" id="formula-strip"></div>

<div class="insight-row" id="insight-row"></div>

<script>
let mode=0,step=0;
const MAX=[4,5,5];
const cvs=document.getElementById('frac-cvs');
const ctx=cvs.getContext('2d');

// ── Sierpiński Carpet ──
function drawCarpet(s,S){
  ctx.fillStyle='#f4f2ec';ctx.fillRect(0,0,S,S);
  ctx.fillStyle='#1650a8';ctx.fillRect(0,0,S,S);
  carve(0,0,S,s);
}
function carve(x,y,size,depth){
  if(depth===0)return;
  const s=size/3;
  ctx.fillStyle='#f4f2ec';ctx.fillRect(x+s,y+s,s,s);
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    if(r===1&&c===1)continue;
    carve(x+c*s,y+r*s,s,depth-1);
  }
}

// ── Sierpiński Gasket ──
function drawGasket(s,S){
  ctx.fillStyle='#f4f2ec';ctx.fillRect(0,0,S,S);
  const pad=20;
  const h=(S-2*pad)*(Math.sqrt(3)/2);
  const cx=S/2,by=S-pad,ty=by-h;
  const ax=cx-(S-2*pad)/2,bx=cx+(S-2*pad)/2;
  ctx.beginPath();ctx.moveTo(cx,ty);ctx.lineTo(ax,by);ctx.lineTo(bx,by);ctx.closePath();
  ctx.fillStyle='#1a6e42';ctx.fill();
  carveGasket(cx,ty,ax,by,bx,by,s);
}
function carveGasket(tx,ty,lx,ly,rx,ry,depth){
  if(depth===0)return;
  const mx=(lx+rx)/2,my=(ly+ry)/2;
  const ml=(tx+lx)/2,mly=(ty+ly)/2;
  const mr=(tx+rx)/2,mry=(ty+ry)/2;
  ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(ml,mly);ctx.lineTo(mr,mry);ctx.closePath();
  ctx.fillStyle='#f4f2ec';ctx.fill();
  carveGasket(tx,ty,ml,mly,mr,mry,depth-1);
  carveGasket(ml,mly,lx,ly,mx,my,depth-1);
  carveGasket(mr,mry,mx,my,rx,ry,depth-1);
}

// ── Koch Snowflake ──
function kochPts(p1,p2,depth){
  if(depth===0)return[p1,p2];
  const dx=p2.x-p1.x,dy=p2.y-p1.y;
  const a={x:p1.x+dx/3,y:p1.y+dy/3};
  const b={x:p1.x+2*dx/3,y:p1.y+2*dy/3};
  const peak={
    x:a.x+(b.x-a.x)*Math.cos(-Math.PI/3)-(b.y-a.y)*Math.sin(-Math.PI/3),
    y:a.y+(b.x-a.x)*Math.sin(-Math.PI/3)+(b.y-a.y)*Math.cos(-Math.PI/3),
  };
  const s1=kochPts(p1,a,depth-1);
  const s2=kochPts(a,peak,depth-1);
  const s3=kochPts(peak,b,depth-1);
  const s4=kochPts(b,p2,depth-1);
  return[...s1.slice(0,-1),...s2.slice(0,-1),...s3.slice(0,-1),...s4];
}
function drawKoch(s,S){
  ctx.fillStyle='#f4f2ec';ctx.fillRect(0,0,S,S);
  const pad=40,r=(S-2*pad)/Math.sqrt(3);
  const cx=S/2,cy=S/2+r*0.1;
  const p0=[
    {x:cx,y:cy-r},
    {x:cx+r*Math.sin(2*Math.PI/3),y:cy-r*Math.cos(2*Math.PI/3)},
    {x:cx+r*Math.sin(4*Math.PI/3),y:cy-r*Math.cos(4*Math.PI/3)},
  ];
  const sides=[kochPts(p0[0],p0[1],s),kochPts(p0[1],p0[2],s),kochPts(p0[2],p0[0],s)];
  const all=[...sides[0].slice(0,-1),...sides[1].slice(0,-1),...sides[2].slice(0,-1)];
  ctx.beginPath();all.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.closePath();
  ctx.fillStyle='#c47a0a';ctx.fill();
  ctx.strokeStyle='#7a4800';ctx.lineWidth=s<3?1.5:0.7;ctx.stroke();
}

function computeStats(){
  if(mode===0){
    const Rn=Math.pow(8,step),Hn=step===0?0:(Math.pow(8,step)-1)/7;
    const area=Math.pow(8/9,step)*100;
    return[
      {lbl:'Remaining squares',val:Rn.toLocaleString('en-IN'),cls:'blue'},
      {lbl:'Holes removed',val:Math.round(Hn).toLocaleString('en-IN'),cls:'red'},
      {lbl:'Area remaining',val:area.toFixed(2)+'%',cls:'green'},
    ];
  } else if(mode===1){
    const Tn=Math.pow(3,step),Hn=step===0?0:(Math.pow(3,step)-1)/2;
    const area=Math.pow(3/4,step)*100;
    return[
      {lbl:'Remaining triangles',val:Tn.toLocaleString('en-IN'),cls:'blue'},
      {lbl:'Holes removed',val:Math.round(Hn).toLocaleString('en-IN'),cls:'red'},
      {lbl:'Area remaining',val:area.toFixed(2)+'%',cls:'green'},
    ];
  } else {
    const sides=3*Math.pow(4,step);
    const perim=(3*Math.pow(4/3,step)).toFixed(4);
    return[
      {lbl:'Number of sides',val:sides.toLocaleString('en-IN'),cls:'blue'},
      {lbl:'Perimeter (per unit)',val:perim,cls:'red'},
    ];
  }
}

function renderStats(){
  const grid=document.getElementById('stats-grid');
  grid.innerHTML='';
  computeStats().forEach(s=>{
    const div=document.createElement('div');div.className='stat-box';
    div.innerHTML=`<div class="sb-lbl">${s.lbl}</div><div class="sb-val ${s.cls}">${s.val}</div>`;
    grid.appendChild(div);
  });
}

function renderFormula(){
  const el=document.getElementById('formula-strip');
  const ir=document.getElementById('insight-row');
  if(mode===0){
    const Rn=Math.pow(8,step),Hn=Math.round((Math.pow(8,step)-1)/7);
    el.innerHTML=
      `<span class="fs-blue">R<sub>n</sub></span> = 8<sup>n</sup> = 8<sup>${step}</sup> = <span class="fs-hl">${Rn.toLocaleString('en-IN')}</span>  remaining squares\n`+
      `<span class="fs-blue">H<sub>n</sub></span> = (8<sup>n</sup>−1)/7 = <span class="fs-hl">${Hn.toLocaleString('en-IN')}</span>  holes removed\n`+
      `Area remaining = (8/9)<sup>n</sup> = <span class="fs-green">${(Math.pow(8/9,step)*100).toFixed(2)}%</span>`;
    ir.innerHTML=`<div class="ins-bar"></div><p class="ins-text">Each remaining square at step n produces <strong>8 new squares</strong> and <strong>1 new hole</strong> at step n+1. The area remaining shrinks by a factor of 8/9 each step — it approaches <strong>zero</strong> as n grows, even though the pattern fills the plane visually.</p>`;
  } else if(mode===1){
    const Tn=Math.pow(3,step),Hn=Math.round((Math.pow(3,step)-1)/2);
    el.innerHTML=
      `Remaining triangles <span class="fs-blue">T<sub>n</sub></span> = 3<sup>n</sup> = 3<sup>${step}</sup> = <span class="fs-hl">${Tn.toLocaleString('en-IN')}</span>\n`+
      `Holes <span class="fs-blue">H<sub>n</sub></span> = (3<sup>n</sup>−1)/2 = <span class="fs-hl">${Hn.toLocaleString('en-IN')}</span>\n`+
      `Area remaining = (3/4)<sup>n</sup> = <span class="fs-green">${(Math.pow(3/4,step)*100).toFixed(2)}%</span>`;
    ir.innerHTML=`<div class="ins-bar"></div><p class="ins-text">Each triangle at step n produces <strong>3 smaller triangles</strong> (the central one is removed). The area remaining is (3/4)<sup>n</sup> — it also approaches zero. The Gasket has the remarkable property that its area is <strong>zero</strong> but its perimeter is <strong>infinite</strong>.</p>`;
  } else {
    const sides=3*Math.pow(4,step);
    const perim=(3*Math.pow(4/3,step)).toFixed(4);
    el.innerHTML=
      `Number of sides = 3 × 4<sup>n</sup> = 3 × 4<sup>${step}</sup> = <span class="fs-hl">${sides.toLocaleString('en-IN')}</span>\n`+
      `Perimeter = 3 × (4/3)<sup>n</sup> = <span class="fs-green">${perim}</span>  (starting side = 1 unit)`;
    ir.innerHTML=`<div class="ins-bar"></div><p class="ins-text">Each side is replaced by 4 shorter sides, so the number of sides grows <strong>4× per step</strong>. The perimeter grows without bound — even though the snowflake fits inside a finite circle. This is the Koch paradox: finite area, <strong>infinite perimeter</strong>.</p>`;
  }
}

function draw(){
  const PR=Math.min(window.devicePixelRatio||1,2);
  const wrap=cvs.parentElement;
  const S=Math.min(wrap.clientWidth-32,480);
  cvs.width=S*PR;cvs.height=S*PR;cvs.style.width=S+'px';cvs.style.height=S+'px';
  ctx.scale(PR,PR);
  if(mode===0)drawCarpet(step,S);
  else if(mode===1)drawGasket(step,S);
  else drawKoch(step,S);
  document.getElementById('step-badge').textContent=step;
  document.getElementById('btn-prev').disabled=step===0;
  document.getElementById('btn-next').disabled=step>=MAX[mode];
  renderStats();renderFormula();
}

document.getElementById('btn-next').addEventListener('click',()=>{if(step<MAX[mode]){step++;draw();}});
document.getElementById('btn-prev').addEventListener('click',()=>{if(step>0){step--;draw();}});
document.getElementById('btn-reset').addEventListener('click',()=>{step=0;draw();});

document.querySelectorAll('.fractal-btn').forEach(b=>b.addEventListener('click',()=>{
  mode=+b.dataset.f;step=0;
  document.querySelectorAll('.fractal-btn').forEach((x,j)=>x.classList.toggle('active',j===mode));
  draw();
}));

window.addEventListener('resize',draw);
draw();
</script>
</body>
</html>
